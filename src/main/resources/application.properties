spring.application.name=crud-backend-java

# Server Port (menggantikan r.Run(":8080") di main.go)
server.port=8080

# === KONFIGURASI DATABASE MYSQL ===
# Sesuaikan dengan nilai dari .env Anda (DB_USER, DB_PASSWORD, dll.)
spring.datasource.url=jdbc:mysql://localhost:3306/nama_database_anda?useSSL=false&serverTimezone=UTC
spring.datasource.username=DB_USER_ANDA
spring.datasource.password=DB_PASSWORD_ANDA

# === KONFIGURASI JPA/HIBERNATE (menggantikan GORM) ===
# `ddl-auto` digunakan untuk migrasi otomatis.
# Pilihan: none, update, create
spring.jpa.hibernate.ddl-auto=update
# Menampilkan SQL di console (opsional)
spring.jpa.show-sql=true
# Dialek untuk MySQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
